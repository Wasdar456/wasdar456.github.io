site_name: Wasdar456
site_description: Wasdar456 的个人复习笔记与资料
site_author: Wasdar456
site_url: https://wasdar456.github.io/
repo_url: https://github.com/Wasdar456/wasdar456.github.io
repo_name: Wasdar456/wasdar456.github.io
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true
hooks:
  - hooks.py

theme:
  name: material
  language: zh
  font: false
  favicon: assets/images/favicon.svg
  logo: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-，。！？；：、（）【】《》“”‘’]+'

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/vendor/mathjax/tex-mml-chtml.js
  - assets/vendor/mermaid/mermaid.min.js
  - assets/javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wasdar456
      name: Wasdar456 on GitHub

copyright: Copyright &copy; 2026 Wasdar456
